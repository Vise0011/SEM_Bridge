name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_bridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user -d test_bridge"
          --health-interval 5s --health-timeout 5s --health-retries 20
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check src scripts tests
      - run: python -m mypy src
      - run: python -m pytest -q
        env:
          SME_BRIDGE_TEST_POSTGRES_DSN: postgresql://test_user:test_password@127.0.0.1:5432/test_bridge
          SME_BRIDGE_TEST_NEO4J_URI: bolt://127.0.0.1:7687
      - run: docker build -t sme-bridge:test .
